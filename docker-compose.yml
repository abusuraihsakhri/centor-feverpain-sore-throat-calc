version: '3.8'

services:
  centor-feverpain-sore-throat-calc:
    build: .
    container_name: centor-feverpain-sore-throat-calc
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=centor-feverpain-sore-throat-calc-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
