name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify deployed application
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          asset_url="${url%/}/scoring.mjs"
          for attempt in {1..10}; do
            if page="$(curl --fail --silent --show-error --location --max-time 20 "$url")" \
              && grep -Fq '<title>FeverPAIN & Centor Sore Throat Calculator</title>' <<< "$page" \
              && curl --fail --silent --show-error --location --max-time 20 "$asset_url" | grep -Fq 'feverPainScore'; then
              echo "Verified $url"
              exit 0
            fi
            sleep 5
          done
          echo "Live Pages smoke test failed: $url" >&2
          exit 1
