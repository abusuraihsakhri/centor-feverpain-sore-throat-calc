name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax check
        run: python -m compileall -q feverpain_calc.py cli.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run CLI smoke tests
        run: |
          python cli.py eval --fever --pus --rapid-onset --inflamed --no-cough --json > /tmp/eval.json
          python cli.py batch -i sample.csv -o out_smoke.csv

      - name: Run browser scoring tests
        run: |
          node --version
          node site/tests.mjs
          node --check site/app.js
          node --check site/scoring.mjs
